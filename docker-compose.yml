services:
  postgres:
    image: postgres:16-alpine
    container_name: devaios-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: devaios
      POSTGRES_PASSWORD: devaios
      POSTGRES_DB: devaios
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devaios -d devaios"]
      interval: 5s
      timeout: 5s
      retries: 10
